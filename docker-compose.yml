version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: messenger_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: messenger_db
      MYSQL_USER: messenger_user
      MYSQL_PASSWORD: messenger_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7
    container_name: messenger_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data:
